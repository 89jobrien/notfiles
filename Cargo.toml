[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/89jobrien/notfiles"
homepage = "https://github.com/89jobrien/notfiles"
keywords = ["dotfiles", "symlink", "stow", "config"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
rust-version = "1.87.0"

[workspace]
members = [
    "crates/notcore",
    "crates/notfiles",
    "crates/notsecrets",
    "crates/nothooks",
    "crates/notnet",
    "crates/notstrap",
    "crates/notgraph",
    "crates/notforge",
    "tests/integration",
]
resolver = "2"

[workspace.dependencies]
anyhow      = "1"
assert_fs   = "1"
base64      = "0.22"
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
clap        = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs        = "6"
globset     = "0.4"
miette      = { version = "7", features = ["derive"] }
notcore     = { path = "crates/notcore" }
notfiles    = { path = "crates/notfiles" }
notforge    = { path = "crates/notforge" }
nothooks    = { path = "crates/nothooks" }
notnet      = { path = "crates/notnet" }
notsecrets  = { path = "crates/notsecrets" }
notstrap = { path = "crates/notstrap", version = "^0.1.0" } #unified
rpassword   = "7"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
strsim      = "0.11"
tempfile    = "3"
thiserror   = "2"
toml        = "0.8"
ureq        = { version = "2", features = ["json"] }
which       = "7"

[profile.release]
codegen-units = 1
opt-level = 3
lto = "thin"
strip = true
