[workspace]
# root = "/path/to/workspace"  # defaults to Cargo.toml location
crates = [
  { dir = "crates/notcore", pkg = "notcore" },
  { dir = "crates/notfiles", pkg = "notfiles" },
  { dir = "crates/notsecrets", pkg = "notsecrets" },
  { dir = "crates/nothooks", pkg = "nothooks" },
  { dir = "crates/notnet", pkg = "notnet" },
  { dir = "crates/notstrap", pkg = "notstrap" },
  { dir = "crates/notgraph", pkg = "notgraph" },
  { dir = "crates/notforge", pkg = "notforge" },
  { dir = "tests/integration", pkg = "integration" },
]
# offline_skip = "test(/.*network.*/)"


[[workspace.propagation]]
source = "notcore"
dependents = ["notfiles", "notsecrets", "nothooks", "notstrap", "notforge", "integration"]

[[workspace.propagation]]
source = "notfiles"
dependents = ["notstrap", "integration"]

[[workspace.propagation]]
source = "nothooks"
dependents = ["notstrap", "integration"]

[[workspace.propagation]]
source = "notnet"
dependents = ["notstrap"]

[[workspace.propagation]]
source = "notsecrets"
dependents = ["notstrap", "integration"]

[[workspace.propagation]]
source = "notstrap"
dependents = ["integration"]

[protocol]
# lockfile = "taskit-protocol.lock"

[[protocol.surfaces]]
name = "notcore-reporter"
path = "crates/notcore/src/reporter.rs"

[[protocol.surfaces]]
name = "notfiles-ports"
path = "crates/notfiles/src/ports.rs"

[[protocol.surfaces]]
name = "notsecrets-ports"
path = "crates/notsecrets/src/ports.rs"

[[protocol.surfaces]]
name = "notforge-ports"
path = "crates/notforge/src/ports.rs"

[[protocol.surfaces]]
name = "notforge-gitea"
path = "crates/notforge/src/gitea.rs"

# Coverage enforcement: run `taskit coverage` to check.
#
# [coverage]
# crate_name = "my-crate"
# threshold = 80.0

[ci]
# cruxfile  = "Cruxfile"  # path to Cruxfile for crux-based pipelines
# fail_fast = false        # stop on first failing step

[[ci.steps]]
name = "self-check"
cmd = "self-check"
gate = true

[[ci.steps]]
name = "fmt --check"
cmd = "fmt --check"
gate = false

[[ci.steps]]
name = "lint"
cmd = "lint"
gate = false

[[ci.steps]]
name = "compile-tests"
cmd = "compile-tests"
gate = false

[[ci.steps]]
name = "test"
cmd = "test"
gate = false

[[ci.steps]]
name = "check-deps"
cmd = "check-deps"
gate = false

[[ci.steps]]
name = "check-protocol-drift"
cmd = "check-protocol-drift"
gate = false

# Metric thresholds for `taskit inspect`. CLI flags override these.
#
# [inspect]
# max_clippy_warnings = 0
# max_clippy_errors   = 0
# max_test_failures   = 0
# max_todo_fixme      = 20   # omit to skip the TODO/FIXME check

# Default retention policy for `taskit clean`. CLI --older-than overrides.
#
# [clean]
# older_than = "7d"  # use `cargo sweep`; omit to run `cargo clean`

# Git flow: main -> develop (work) -> staging (integration) -> release (publish) -> main
# These are the defaults; uncomment to customize branch names.
#
# [flow]
# main = "main"
# develop = "develop"
# staging = "staging"
# release = "release"

[release]
# github_repo = "owner/repo"  # auto-detected from git remote
publish_order = [
  "notcore",
  "notgraph",
  "notnet",
  "notfiles",
  "notforge",
  "nothooks",
  "notsecrets",
  "notstrap",
  "integration",
]
# skip_docs   = false  # skip `cargo doc` before publishing
# allow_dirty = false  # publish with uncommitted changes
