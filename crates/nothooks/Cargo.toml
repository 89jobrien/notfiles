[package]
name    = "nothooks"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "nothooks"
path = "src/main.rs"

[lib]
name = "nothooks"
path = "src/lib.rs"

[dependencies]
anyhow              = { workspace = true }
clap                = { workspace = true }
clap_complete       = "4"
clap_complete_nushell = "4"
notcore             = { workspace = true }
serde               = { workspace = true }
toml                = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
