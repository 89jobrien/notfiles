[package]
name    = "notgraph"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
name = "notgraph_lib"
path = "src/lib.rs"

[[bin]]
name = "notgraph"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
anyhow                = { workspace = true }
cargo_metadata        = "0.18"
clap                  = { workspace = true }
clap_complete         = "4"
clap_complete_nushell = "4"
serde          = { workspace = true }
serde_json     = "1"
syn            = { version = "2", features = ["full", "visit"] }
walkdir        = "2"
