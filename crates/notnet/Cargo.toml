[package]
name    = "notnet"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Tailscale network presence management for notstrap"

[dependencies]
anyhow    = { workspace = true }
rpassword = { workspace = true }
serde     = { workspace = true }
tempfile  = { workspace = true }
thiserror = { workspace = true }
yubikey   = { version = "0.8", optional = true, features = ["untested"] }

[features]
# The YubiKey PIV slot-9d source is opt-in: it links the system PC/SC library
# (libpcsclite on Linux), which a default build must not require.
default = []
yubikey = ["dep:yubikey"]
