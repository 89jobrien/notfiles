[package]
name    = "notsecrets"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow           = { workspace = true }
base64           = "0.22"
bech32           = "0.11"
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
dirs             = { workspace = true }
ed25519-dalek    = "2"
hkdf             = "0.12"
hmac             = "0.12"
notcore          = { workspace = true }
rand             = "0.8"
rpassword        = { workspace = true }
scrypt           = "0.11"
serde            = { workspace = true }
sha2             = "0.10"
thiserror        = { workspace = true }
toml             = { workspace = true }
x25519-dalek     = { version = "2", features = ["static_secrets"] }
yubikey          = { version = "0.8", optional = true }
zeroize          = "1"

[features]
default = []
yubikey = ["dep:yubikey"]

[dev-dependencies]
tempfile = { workspace = true }
